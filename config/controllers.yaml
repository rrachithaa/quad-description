controller_manager:
  ros__parameters:
    update_rate: 200
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - fl_hip_joint
      - fl_thigh_joint
      - fl_knee_joint
      - fr_hip_joint
      - fr_thigh_joint
      - fr_knee_joint
      - rl_hip_joint
      - rl_thigh_joint
      - rl_knee_joint
      - rr_hip_joint
      - rr_thigh_joint
      - rr_knee_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
